<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Registro de Recicladores</title>
  <style>
    #map {
      height: 500px;
      width: 100%;
      margin-bottom: 20px;
    }
  </style>
</head>
<body>

  <h2>Registro de Recicladores</h2>

  <div id="map"></div>

  <form id="registroForm">
    <input type="text" id="nombre" placeholder="Nombre del reciclador" required><br>
    <input type="text" id="nit" placeholder="NIT" required><br>
    <input type="text" id="direccion" placeholder="Dirección" required><br>
    <input type="text" id="sector" placeholder="Sector" required><br>
    <input type="tel" id="telefono" placeholder="Teléfono" required><br>
    <input type="email" id="correo" placeholder="Correo electrónico" required><br>
    <button type="submit">Registrar Reciclador</button>
  </form>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- Google Maps -->
  <script async defer
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBEO4kGVuRJbZ9pf4Ruf-V21ZuPLBKl6z0&callback=initMap">
  </script>

  <script>
    // Configuración de Firebase
    const firebaseConfig = {
      apiKey: "AIzaSyBEO4kGVuRJbZ9pf4Ruf-V21ZuPLBKl6z0",
      authDomain: "tuprojecto.firebaseapp.com",
      projectId: "tuprojecto",
      storageBucket: "tuprojecto.appspot.com",
      messagingSenderId: "1234567890",
      appId: "1:1234567890:web:abcdefghij"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let map;
    let marker;

    function initMap() {
      map = new google.maps.Map(document.getElementById("map"), {
        center: { lat: 7.0652, lng: -73.8511 }, // Centro inicial (Barrancabermeja)
        zoom: 14,
      });

      marker = new google.maps.Marker({
        map,
        draggable: false,
      });

      if (navigator.geolocation) {
        navigator.geolocation.watchPosition(
          position => {
            const pos = {
              lat: position.coords.latitude,
              lng: position.coords.longitude,
            };
            map.setCenter(pos);
            marker.setPosition(pos);
            obtenerDireccion(pos);
          },
          () => alert("No se pudo obtener la ubicación.")
        );
      } else {
        alert("Tu navegador no soporta geolocalización.");
      }
    }

    function obtenerDireccion(pos) {
      const geocoderURL = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${pos.lat},${pos.lng}&key=AIzaSyBEO4kGVuRJbZ9pf4Ruf-V21ZuPLBKl6z0`;
      fetch(geocoderURL)
        .then(res => res.json())
        .then(data => {
          const direccion = data.results[0]?.formatted_address || "Dirección no encontrada";
          document.getElementById("direccion").value = direccion;
        })
        .catch(err => console.error("Error al obtener la dirección:", err));
    }

    document.getElementById("registroForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const reciclador = {
        nombre: document.getElementById("nombre").value,
        nit: document.getElementById("nit").value,
        direccion: document.getElementById("direccion").value,
        sector: document.getElementById("sector").value,
        telefono: document.getElementById("telefono").value,
        correo: document.getElementById("correo").value,
        latitud: marker.getPosition().lat(),
        longitud: marker.getPosition().lng(),
        fecha: new Date()
      };

      db.collection("recicladores").add(reciclador)
        .then(() => {
          alert("Reciclador registrado con éxito.");
          document.getElementById("registroForm").reset();
        })
        .catch(error => {
          console.error("Error al guardar:", error);
          alert("Error al registrar.");
        });
    });
  </script>

</body>
</html>
